name: Debian Native Live ISO
on:
  pull_request:
    paths:
      - 'packaging/debian/**'
      - 'packaging/common/**'
      - '.github/workflows/debian-native-iso.yml'
      - 'packaging/native/**'
      - 'cmd/**'
      - 'internal/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LOCAS_UPDATE_PUBLIC_KEY_B64: ${{ vars.LOCAS_RELEASE_ED25519_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build inside upstream Debian 13 container
        shell: bash
        run: |
          set -Eeuo pipefail
          # This privileged container runs ONLY on a disposable GitHub-hosted VM.
          # Never run this command on physical LocasOS production hardware.
          docker run --rm --privileged \
            -v "$PWD:/src" -w /src \
            -e LOCAS_UPDATE_PUBLIC_KEY_B64 \
            debian:trixie bash -lc '
              set -Eeuo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates python3 golang-go live-build debootstrap xorriso \
                squashfs-tools grub-efi-amd64-bin syslinux-common \
                qemu-system-x86 ovmf
              bash -n packaging/debian/build-live-iso.sh
              bash packaging/debian/build-live-iso.sh
            '
          sudo chown -R "$USER:$USER" dist build
      - name: Install VM verification tools on runner
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xorriso qemu-system-x86 ovmf
      - name: Verify ISO identity and EFI metadata
        run: |
          cd dist/debian
          sha256sum -c locasos-native-developer-amd64.iso.sha256
          xorriso -indev locasos-native-developer-amd64.iso -report_el_torito plain | tee boot-report.txt
          grep -Eiq 'EFI|platform id 0xef|UEFI' boot-report.txt
      - name: UEFI QEMU live-boot smoke (diskless)
        shell: bash
        run: |
          set -Eeuo pipefail
          firmware=
          for option in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do
            if [[ -f "$option" ]]; then firmware="$option"; break; fi
          done
          [[ -n "$firmware" ]] || { echo 'Missing OVMF firmware' >&2; exit 1; }
          set +e
          timeout 35 qemu-system-x86_64 \
            -machine q35,accel=tcg -m 2048 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$firmware" \
            -cdrom dist/debian/locasos-native-developer-amd64.iso \
            -boot order=d -nographic -serial none -monitor none -no-reboot
          result=$?
          set -e
          [[ "$result" -eq 124 ]] || { echo "UEFI VM exited unexpectedly ($result)" >&2; exit 1; }
          echo 'PASS: diskless UEFI VM smoke process alive (guest health still requires separate testing)'
      - name: Publish short-lived development artifact
        uses: actions/upload-artifact@v4
        with:
          name: locasos-debian-native-developer-iso
          path: |
            dist/debian/locasos-native-developer-amd64.iso
            dist/debian/locasos-native-developer-amd64.iso.sha256
            dist/debian/boot-report.txt
          retention-days: 3

  vm-install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download verified developer ISO
        uses: actions/download-artifact@v4
        with:
          name: locasos-debian-native-developer-iso
          path: dist/debian
      - name: Install QEMU acceptance tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
      - name: Verify exact CI ISO bytes
        run: (cd dist/debian && sha256sum -c locasos-native-developer-amd64.iso.sha256)
      - name: Install onto disposable QEMU disk, then boot without ISO
        shell: bash
        timeout-minutes: 40
        run: |
          set -Eeuo pipefail
          code=
          vars=
          for pair in "OVMF_CODE_4M.fd OVMF_VARS_4M.fd" "OVMF_CODE.fd OVMF_VARS.fd"; do
            read -r code_name vars_name <<< "$pair"
            if [[ -f "/usr/share/OVMF/$code_name" && -f "/usr/share/OVMF/$vars_name" ]]; then
              code="/usr/share/OVMF/$code_name"
              vars="/usr/share/OVMF/$vars_name"
              break
            fi
          done
          [[ -n "$code" && -n "$vars" ]] || { echo "No matching OVMF_CODE/VARS firmware pair" >&2; exit 1; }
          digest="$(awk 'NR==1 {print $1}' dist/debian/locasos-native-developer-amd64.iso.sha256)"
          mkdir -p dist/debian/vm-logs
          python3 packaging/debian/installer/verify_native_vm_install.py \
            --iso dist/debian/locasos-native-developer-amd64.iso \
            --sha256 "$digest" --ovmf-code "$code" --ovmf-vars "$vars" \
            --live-timeout 480 --install-timeout 900 --boot-timeout 480 \
            --log-dir dist/debian/vm-logs
      - name: Publish QEMU serial diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locasos-native-disposable-two-boot-logs
          path: dist/debian/vm-logs/
          if-no-files-found: ignore
          retention-days: 5
