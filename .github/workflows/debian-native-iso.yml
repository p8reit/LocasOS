name: Debian Native Live ISO
on:
  pull_request:
    paths:
      - 'packaging/debian/**'
      - 'packaging/common/**'
      - '.github/workflows/debian-native-iso.yml'
      - 'packaging/native/**'
      - 'cmd/**'
      - 'internal/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LOCAS_UPDATE_PUBLIC_KEY_B64: ${{ vars.LOCAS_RELEASE_ED25519_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build inside upstream Debian 13 container
        shell: bash
        run: |
          set -Eeuo pipefail
          # This privileged container runs ONLY on a disposable GitHub-hosted VM.
          # Never run this command on physical LocasOS production hardware.
          docker run --rm --privileged \
            -v "$PWD:/src" -w /src \
            -e LOCAS_UPDATE_PUBLIC_KEY_B64 \
            debian:trixie bash -lc '
              set -Eeuo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates python3 golang-go live-build debootstrap xorriso \
                squashfs-tools grub-efi-amd64-bin syslinux-common \
                qemu-system-x86 ovmf
              bash -n packaging/debian/build-live-iso.sh
              bash packaging/debian/build-live-iso.sh
            '
          sudo chown -R "$USER:$USER" dist build
      - name: Install VM verification tools on runner
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xorriso qemu-system-x86 qemu-utils ovmf
      - name: Verify ISO identity and EFI metadata
        run: |
          cd dist/debian
          sha256sum -c locasos-native-developer-amd64.iso.sha256
          xorriso -indev locasos-native-developer-amd64.iso -report_el_torito plain | tee boot-report.txt
          grep -Eiq 'EFI|platform id 0xef|UEFI' boot-report.txt
      - name: UEFI live and installed-disk QEMU acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist/debian/vm-logs
          python3 packaging/debian/installer/vm_install_integration.py \
            --iso dist/debian/locasos-native-developer-amd64.iso \
            --live-timeout 600 --installed-timeout 300 \
            --log-dir dist/debian/vm-logs
      - name: Publish VM diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locasos-native-vm-install-logs
          path: dist/debian/vm-logs/
          if-no-files-found: ignore
          retention-days: 5
      - name: Publish short-lived development artifact
        uses: actions/upload-artifact@v4
        with:
          name: locasos-debian-native-developer-iso
          path: |
            dist/debian/locasos-native-developer-amd64.iso
            dist/debian/locasos-native-developer-amd64.iso.sha256
            dist/debian/boot-report.txt
          retention-days: 3
