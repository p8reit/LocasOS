name: Native UEFI Full VM Acceptance
on:
  pull_request:
    paths:
      - 'packaging/native/make-vm-autoinstall-seed.sh'
      - 'packaging/native/launch-vm-autoinstall.sh'
      - 'packaging/native/boot-installed-vm.sh'
      - '.github/workflows/native-uefi-full-vm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Prepare host test tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf cloud-image-utils xorriso openssl gpgv openssh-client
          if [[ -c /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          ring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          gpg --show-keys --with-colons "$ring" | grep -Fxq 'fpr:::::::::843938DF228D22F7B3742BC0D94AA3F0EFE21092:'
          echo "UBUNTU_TRUST_RING=$ring" >> "$GITHUB_ENV"
      - name: Authenticate official Ubuntu 24.04.5 ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/locas-iso
          base=https://releases.ubuntu.com/24.04
          curl -fL --retry 3 -o /tmp/locas-iso/SHA256SUMS "$base/SHA256SUMS"
          curl -fL --retry 3 -o /tmp/locas-iso/SHA256SUMS.gpg "$base/SHA256SUMS.gpg"
          curl -fL --retry 3 -o /tmp/locas-iso/ubuntu-24.04.5-live-server-amd64.iso "$base/ubuntu-24.04.5-live-server-amd64.iso"
          bash packaging/native/verify-ubuntu-iso.sh \
            /tmp/locas-iso/ubuntu-24.04.5-live-server-amd64.iso \
            /tmp/locas-iso/SHA256SUMS /tmp/locas-iso/SHA256SUMS.gpg "$UBUNTU_TRUST_RING"
      - name: Create signed ephemeral native payload
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 0700 /tmp/locas-private
          go run ./cmd/locas-release keygen /tmp/locas-private/signing.key > /tmp/locas-private/keygen.txt
          export LOCAS_RELEASE_ED25519_PRIVATE_KEY_B64="$(cat /tmp/locas-private/signing.key)"
          export LOCAS_UPDATE_PUBLIC_KEY_B64="$(sed -n 's/^Public verification key: //p' /tmp/locas-private/keygen.txt)"
          bash packaging/native/build-payload.sh
          go build -o /tmp/locas-private/locas-release ./cmd/locas-release
          /tmp/locas-private/locas-release sign-native v0.11.0 "$GITHUB_SHA" dist/native
          /tmp/locas-private/locas-release verify-native v0.11.0 dist/native
          echo "LOCAS_UPDATE_PUBLIC_KEY_B64=$LOCAS_UPDATE_PUBLIC_KEY_B64" >> "$GITHUB_ENV"
          rm -f /tmp/locas-private/signing.key
      - name: Create guarded VM-only seed and install Ubuntu into disposable qcow2
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh-keygen -q -t ed25519 -N '' -f /tmp/locas-vm-sshkey
          export LOCAS_NATIVE_VM_AUTOINSTALL_ACK=I_ACCEPT_ERASING_A_DISPOSABLE_QEMU_IMAGE_ONLY
          bash packaging/native/make-vm-autoinstall-seed.sh /tmp/locas-vm-seed /tmp/locas-vm-sshkey.pub
          # A bounded test: do not attach any existing host disks. Installer may power off on success.
          exit_status=0
          timeout 1500s bash packaging/native/launch-vm-autoinstall.sh \
            /tmp/locas-iso/ubuntu-24.04.5-live-server-amd64.iso \
            /tmp/locas-vm-seed/seed.iso /tmp/locas-vm-disk \
            > /tmp/locas-autoinstall-console.log 2>&1 || exit_status=$?
          if [[ "$exit_status" -ne 0 ]]; then
            echo "Autoinstall did not shut down normally (status $exit_status)" >&2
            tail -n 150 /tmp/locas-autoinstall-console.log || true
            exit 1
          fi
          test -s /tmp/locas-vm-disk/disposable.qcow2
      - name: Boot installed VM and verify guest SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          export LOCAS_NATIVE_VM_AUTOINSTALL_ACK=I_ACCEPT_ERASING_A_DISPOSABLE_QEMU_IMAGE_ONLY
          bash packaging/native/boot-installed-vm.sh /tmp/locas-vm-disk \
            > /tmp/locas-installed-boot.log 2>&1 &
          echo "$!" > /tmp/locas-vm-pid
          ssh_opts=(-i /tmp/locas-vm-sshkey -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=4 -o BatchMode=yes)
          ready=false
          for attempt in $(seq 1 90); do
            if ssh "${ssh_opts[@]}" locasdev@127.0.0.1 'test -d /run/systemd/system && grep -q "24.04" /etc/os-release' 2>/dev/null; then
              ready=true; break
            fi
            sleep 8
          done
          [[ "$ready" == true ]] || { echo 'Guest SSH did not become ready' >&2; exit 1; }
          echo 'PASS: Ubuntu installed and VM rebooted to SSH/systemd'
      - name: Deploy signed native payload and check service health
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_opts=(-i /tmp/locas-vm-sshkey -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o BatchMode=yes)
          scp_opts=(-i /tmp/locas-vm-sshkey -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" locasdev@127.0.0.1 'mkdir -p ~/native'
          scp "${scp_opts[@]}" dist/native/locasos-native-payload-amd64.tar \
            dist/native/locasos-native-payload-amd64.tar.sha256 \
            dist/native/locasos-native.json dist/native/locasos-native.sig \
            packaging/native/install-native-vm.sh packaging/native/verify-archive.py \
            packaging/native/test-native-vm.sh /tmp/locas-private/locas-release \
            locasdev@127.0.0.1:~/native/
          password="$(cat /tmp/locas-vm-seed/vm-test-password)"
          printf '%s\n' "$password" | ssh "${ssh_opts[@]}" locasdev@127.0.0.1 \
            "sudo -S env LOCAS_NATIVE_VM_ACK=I_UNDERSTAND_THIS_IS_A_DISPOSABLE_VM LOCAS_UPDATE_PUBLIC_KEY_B64='$LOCAS_UPDATE_PUBLIC_KEY_B64' LOCAS_NATIVE_VERIFY_BIN=/home/locasdev/native/locas-release LOCAS_NATIVE_VERSION=v0.11.0 bash /home/locasdev/native/install-native-vm.sh /home/locasdev/native/locasos-native-payload-amd64.tar"
          printf '%s\n' "$password" | ssh "${ssh_opts[@]}" locasdev@127.0.0.1 \
            'sudo -S bash /home/locasdev/native/test-native-vm.sh'
          # Persistent VM disk boot accepted; full cold-restart smoke remains separate.
      - name: Preserve scrubbed VM test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-full-uefi-vm-diagnostics
          path: |
            /tmp/locas-autoinstall-console.log
            /tmp/locas-installed-boot.log
          if-no-files-found: ignore
          retention-days: 7
