name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Go tests
        run: |
          if [ -f go.mod ]; then go test ./...; else echo "Go scaffold pending: tracked in LOS-002"; fi
      - name: Durable queue without CGO
        run: CGO_ENABLED=0 go test ./internal/jobqueue ./tests/jobqueue
      - name: Security audit, queue and approval race checks
        run: go test -race ./internal/auditlog ./internal/auditop ./internal/admin ./internal/peercred ./internal/appmanager ./internal/updateapproval ./internal/updatequeue ./internal/updatetrust ./cmd/locas-core ./cmd/locas-agent ./cmd/locas-updater ./cmd/locas-app-worker ./internal/jobqueue ./tests/jobqueue
      - name: Build identity and actual binary metadata
        run: LOCAS_TEST_GO="$(command -v go)" python3 tests/build-identity.test.py
      - name: Go formatting
        run: |
          if [ -f go.mod ]; then files="$(gofmt -l ./cmd ./internal ./tests/jobqueue)"; printf "%s\\n" "$files"; if [ -n "$files" ]; then gofmt -d ./cmd ./internal ./tests/jobqueue; exit 1; fi; fi
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          find scripts packaging/wsl -type f -name '*.sh' -print0 2>/dev/null | xargs -0 -r -n1 bash -n
      - name: Upgrade recovery and archive safety
        run: python3 tests/upgrade-recovery.test.py
      - name: Runtime installer regressions
        run: python3 tests/runtime-installers.test.py
  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Embedded dashboard update selection
        run: node --test tests/*.test.cjs
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check project policy
        run: |
          test -f project/AGENT_POLICY.md
          test -f docs/adr/0001-platform-foundation.md
      - name: Deployment guide links and Bash examples (parse only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          documents = [Path('docs/TEST_DEPLOYMENTS.md'), *Path('docs/testing').glob('*.md')]
          for document in documents:
              source = document.read_text()
              assert len(re.findall(r'^```', source, re.M)) % 2 == 0, document
              for target in re.findall(r'\]\(([^)]+)\)', source):
                  if '://' not in target and not target.startswith('#'):
                      assert (document.parent / target.split('#')[0]).exists(), (document, target)
              for example in re.findall(r'^```bash\r?\n(.*?)^```\s*$', source, re.M | re.S):
                  subprocess.run(['bash', '-n'], input=example, text=True, check=True)
          print('PASS: deployment guide links and Bash syntax; no examples executed')
          PY
      - name: Deployment guide PowerShell examples (parse only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $count = 0
          foreach ($document in (Get-ChildItem docs/testing -Filter '*.md')) {
              $source = Get-Content -LiteralPath $document.FullName -Raw
              foreach ($example in [regex]::Matches($source, '(?ms)^```powershell\r?\n(.*?)^```\s*$')) {
                  $tokens = $null
                  $parseErrors = $null
                  [void][System.Management.Automation.Language.Parser]::ParseInput($example.Groups[1].Value, [ref]$tokens, [ref]$parseErrors)
                  if ($parseErrors.Count -gt 0) { throw "$($document.Name): $($parseErrors | Out-String)" }
                  $count++
              }
          }
          if ($count -eq 0) { throw 'No PowerShell examples found' }
          Write-Host "PASS: $count PowerShell examples parsed; none executed"
  appliance-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Parse packaged upgrade script
        run: bash -n packaging/wsl/upgrade-locas.sh
      - name: Build and validate upgrade archive
        run: |
          bash packaging/wsl/build-rootfs.sh
          cd dist
          sha256sum -c locasos-upgrade-amd64.tar.sha256
          tar tf locasos-upgrade-amd64.tar > upgrade-manifest.txt
          grep -qx 'opt/locas/bin/locas-core' upgrade-manifest.txt
          grep -qx 'opt/locas/bin/locas-audit' upgrade-manifest.txt
          grep -qx 'opt/locas/bin/locas-app-worker' upgrade-manifest.txt
          if grep -Eq '^([.]/?)$' upgrade-manifest.txt; then
            echo 'Unsafe upgrade archive modifies filesystem root' >&2
            exit 1
          fi
      - name: Stage in-place upgrade test package
        run: |
          cp packaging/wsl/Upgrade-LocasOS.ps1 dist/
          cp packaging/wsl/upgrade-locas.sh dist/
          bash -n dist/upgrade-locas.sh
          cp packaging/wsl/Test-LocasOS.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: locasos-verified-upgrade
          path: |
            dist/locasos-upgrade-amd64.tar
            dist/locasos-upgrade-amd64.tar.sha256
            dist/Upgrade-LocasOS.ps1
            dist/upgrade-locas.sh
            dist/Test-LocasOS.ps1
          retention-days: 7
