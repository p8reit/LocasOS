name: Native Publisher Signature
on:
  pull_request:
    paths:
      - 'cmd/locas-release/**'
      - 'packaging/native/**'
      - '.github/workflows/native-publisher-signature.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/locas-release/**'
      - 'packaging/native/**'
      - '.github/workflows/native-publisher-signature.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-signature:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Format and test
        run: |
          test -z "$(gofmt -l cmd/locas-release)"
          go test ./...
          bash -n packaging/native/install-native-vm.sh packaging/native/stage-iso.sh
      - name: Verify isolated signing, platform isolation and tamper rejection
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          go build -o "$tmp/locas-release" ./cmd/locas-release
          "$tmp/locas-release" keygen "$tmp/private.key" > "$tmp/keygen.txt"
          export LOCAS_UPDATE_PUBLIC_KEY_B64="$(sed -n 's/^Public verification key: //p' "$tmp/keygen.txt")"
          export LOCAS_RELEASE_ED25519_PRIVATE_KEY_B64="$(cat "$tmp/private.key")"
          echo 'synthetic native vm payload' > "$tmp/locasos-native-payload-amd64.tar"
          "$tmp/locas-release" sign-native v0.11.0 0123456789abcdef0123456789abcdef01234567 "$tmp"
          "$tmp/locas-release" verify-native v0.11.0 "$tmp"
          if "$tmp/locas-release" verify-native v0.11.1 "$tmp"; then
            echo 'FAIL: cross-version native signature accepted' >&2; exit 1
          fi
          echo 'modified' >> "$tmp/locasos-native-payload-amd64.tar"
          if "$tmp/locas-release" verify-native v0.11.0 "$tmp"; then
            echo 'FAIL: payload tampering accepted' >&2; exit 1
          fi
          echo 'forged' >> "$tmp/locasos-native.json"
          if "$tmp/locas-release" verify-native v0.11.0 "$tmp"; then
            echo 'FAIL: modified manifest accepted' >&2; exit 1
          fi
          echo 'PASS: native publisher signature negative tests'
