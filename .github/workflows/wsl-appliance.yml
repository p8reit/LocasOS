name: WSL Appliance Build
on:
  push:
    branches: [main]
    paths:
      - 'packaging/wsl/**'
      - 'packaging/common/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - '.github/workflows/wsl-appliance.yml'
  pull_request:
    paths:
      - 'packaging/wsl/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - '.github/workflows/wsl-appliance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Validate scripts and Go
        run: |
          bash -n packaging/wsl/firstboot.sh packaging/wsl/build-rootfs.sh packaging/wsl/install-ollama.sh packaging/wsl/repair-ollama.sh packaging/wsl/install-open-webui.sh packaging/wsl/locas-app-worker.sh packaging/wsl/upgrade-locas.sh packaging/wsl/repair-ollama-runner.sh
          go test ./...
          test -z "$(gofmt -l ./cmd ./internal)"
      - name: Validate Windows installer syntax and readiness contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('packaging/wsl/Install-LocasOS.ps1', 'packaging/wsl/Install-TestPackage.ps1', 'packaging/wsl/Install-LocasOS-WSL.ps1', 'packaging/wsl/Install-Release-LocasOS.ps1', 'packaging/wsl/Test-LocasOS.ps1', 'packaging/wsl/Backup-LocasOS-ForDebian.ps1', 'packaging/wsl/Test-DebianWSL-Release.ps1', 'packaging/wsl/Keep-LocasOS-Test-Running.ps1', 'packaging/wsl/Enable-LocasOS-Test-Keepalive.ps1', 'packaging/wsl/Disable-LocasOS-Test-Keepalive.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$path failed PowerShell parsing: $($errors | Out-String)" }
          }
          $installer = Get-Content packaging/wsl/Install-LocasOS.ps1 -Raw
          foreach ($required in @('PASS: LOCAS services and Windows dashboard health verified.', 'http://127.0.0.1:59420/healthz', 'locas-core')) {
            if (-not $installer.Contains($required)) { throw "Missing installer readiness contract: $required" }
          }
          foreach ($required in @('systemctl start $service', 'locas-agent.service', 'locas-core.service', 'Failed to activate $service after first boot')) {
            if (-not $installer.Contains($required)) { throw "Missing first-boot activation contract: $required" }
          }
          Write-Host 'Windows importer parse and readiness contract passed.'
      - name: Confirm shared Debian dependency manifest
        run: |
          grep -q 'packaging/common/base-packages.txt' packaging/wsl/rootfs.Dockerfile
          grep -q 'packaging/common/base-packages.txt' packaging/debian/build-live-iso.sh
          grep -q 'FROM debian:trixie-slim' packaging/wsl/rootfs.Dockerfile
      - name: Build image and checksummed rootfs
        run: bash packaging/wsl/build-rootfs.sh
      - name: Inject update failure and verify full rollback in isolated rootfs
        run: bash packaging/wsl/test-upgrade-rollback.sh
      - name: Verify rootfs contents
        run: |
          cd dist
          sha256sum -c locasos-wsl-amd64.tar.sha256
          sha256sum -c locasos-upgrade-amd64.tar.sha256
          tar tf locasos-upgrade-amd64.tar | grep -q 'opt/locas/bin/locas-core'
          if tar tf locasos-upgrade-amd64.tar | grep -Eq '(^/|(^|/)\.\.(/|$))'; then echo 'Unsafe update archive path' >&2; exit 1; fi
          tar tf locasos-wsl-amd64.tar > tar-contents.txt
          grep -q 'opt/locas/bin/locas-core' tar-contents.txt
          grep -q 'etc/wsl.conf' tar-contents.txt
          grep -q 'etc/os-release' tar-contents.txt
          tar -xOf locasos-upgrade-amd64.tar opt/locas/bin/locas-os-base | grep -Fxq 'debian:13'
          docker run --rm locasos-rootfs-build:dev sh -c '. /etc/os-release; test "$ID" = debian && test "$VERSION_ID" = 13'
      - name: Bundle Windows installer with archive
        run: |
          cp packaging/wsl/Install-LocasOS.ps1 dist/
          cp packaging/wsl/Install-LocasOS-WSL.ps1 dist/
          cp packaging/wsl/Install-TestPackage.ps1 dist/
          cp packaging/wsl/diagnose.ps1 dist/
          cp packaging/wsl/Test-LocasOS.ps1 dist/
          cp packaging/wsl/Keep-LocasOS-Running.ps1 dist/
          cp packaging/wsl/Enable-LocasOS-Autostart.ps1 dist/
          cp packaging/wsl/Repair-LocasOS-Autostart.ps1 dist/
          cp packaging/wsl/Disable-LocasOS-Autostart.ps1 dist/
          cp packaging/wsl/Reset-LocasOS-Test.ps1 dist/
          cp packaging/wsl/Install-Ollama-LocasOS.ps1 dist/
          cp packaging/wsl/install-ollama.sh dist/
          cp packaging/wsl/Test-Ollama-LocasOS.ps1 dist/
          cp packaging/wsl/repair-ollama.sh dist/
          cp packaging/wsl/Repair-Ollama-LocasOS.ps1 dist/
          cp packaging/wsl/repair-ollama-runner.sh dist/
          cp packaging/wsl/Repair-Ollama-Runner-LocasOS.ps1 dist/
          cp packaging/wsl/install-open-webui.sh dist/
          cp packaging/wsl/Install-OpenWebUI-LocasOS.ps1 dist/
          cp packaging/wsl/Upgrade-LocasOS.ps1 dist/
          cp packaging/wsl/upgrade-locas.sh dist/
          cp packaging/wsl/Test-OpenWebUI-LocasOS.ps1 dist/
          cp packaging/wsl/Keep-LocasOS-Test-Running.ps1 dist/
          cp packaging/wsl/Enable-LocasOS-Test-Keepalive.ps1 dist/
          cp packaging/wsl/Disable-LocasOS-Test-Keepalive.ps1 dist/
          cp packaging/wsl/README.md dist/TESTING.md
          cp packaging/wsl/Backup-LocasOS-ForDebian.ps1 dist/
          cp packaging/wsl/Test-DebianWSL-Release.ps1 dist/
      - name: Stamp artifact provenance
        run: |
          printf '{"schema":1,"repository":"%s","commit":"%s","source_ref":"%s","run_id":"%s","run_url":"%s"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > dist/locasos-build-info.json
          cat dist/locasos-build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: locasos-wsl-dev-rootfs
          path: |
            dist/locasos-wsl-amd64.tar
            dist/locasos-wsl-amd64.tar.sha256
            dist/locasos-build-info.json
            dist/locasos-upgrade-amd64.tar
            dist/locasos-upgrade-amd64.tar.sha256
            dist/Upgrade-LocasOS.ps1
            dist/upgrade-locas.sh
            dist/Install-LocasOS.ps1
            dist/Install-LocasOS-WSL.ps1
            dist/Install-TestPackage.ps1
            dist/diagnose.ps1
            dist/Test-LocasOS.ps1
            dist/Keep-LocasOS-Running.ps1
            dist/Enable-LocasOS-Autostart.ps1
            dist/Repair-LocasOS-Autostart.ps1
            dist/Disable-LocasOS-Autostart.ps1
            dist/Reset-LocasOS-Test.ps1
            dist/Install-Ollama-LocasOS.ps1
            dist/install-ollama.sh
            dist/Test-Ollama-LocasOS.ps1
            dist/repair-ollama.sh
            dist/Repair-Ollama-LocasOS.ps1
            dist/repair-ollama-runner.sh
            dist/Repair-Ollama-Runner-LocasOS.ps1
            dist/install-open-webui.sh
            dist/Install-OpenWebUI-LocasOS.ps1
            dist/Test-OpenWebUI-LocasOS.ps1
            dist/Keep-LocasOS-Test-Running.ps1
            dist/Enable-LocasOS-Test-Keepalive.ps1
            dist/Disable-LocasOS-Test-Keepalive.ps1
            dist/TESTING.md
            dist/Backup-LocasOS-ForDebian.ps1
            dist/Test-DebianWSL-Release.ps1
          retention-days: 7
