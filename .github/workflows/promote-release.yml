name: Promote LOCAS Beta to Stable
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tested release tag (for example v0.10.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  promote:
    if: github.repository == 'p8reit/LocasOS'
    runs-on: ubuntu-24.04
    environment: locasos-stable-promotion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Promote exactly the tested signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          LOCAS_RELEASE_ED25519_PUBLIC_KEY_B64: ${{ vars.LOCAS_RELEASE_ED25519_PUBLIC_KEY_B64 }}
        run: |
          set -Eeuo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version tag' >&2; exit 1; }
          test -n "$LOCAS_RELEASE_ED25519_PUBLIC_KEY_B64" || { echo 'Pinned publisher verification key missing. Promotion blocked.' >&2; exit 1; }
          current="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"
          echo "$current" | jq -e '.draft == false and .prerelease == true' >/dev/null
          for required in locasos-upgrade-amd64.tar locasos-update.json locasos-update.sig Upgrade-LocasOS.ps1 upgrade-locas.sh; do
            echo "$current" | jq -e --arg n "$required" '[.assets[].name] | index($n) != null' >/dev/null
          done
          # The key comes from protected environment configuration, never the release.
          echo "$current" | jq -e '[.assets[] | select(.name == "locasos-upgrade-amd64.tar" or .name == "locasos-update.json" or .name == "locasos-update.sig")] | length == 3 and all(.size > 0 and .size <= 536870912)' >/dev/null
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          timeout 180 gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$stage" \
            --pattern locasos-upgrade-amd64.tar --pattern locasos-update.json --pattern locasos-update.sig
          commit="$(git rev-parse "$VERSION^{commit}")"
          go run ./cmd/locas-release verify "$VERSION" "$commit" "$stage"
          # Refuse publication if release metadata changed while downloading/verifying.
          after="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"
          snapshot='{id,tag_name,target_commitish,draft,prerelease,assets:([.assets[] | {id,name,size,updated_at,digest}] | sort_by(.id))}'
          test "$(echo "$current" | jq -cS "$snapshot")" = "$(echo "$after" | jq -cS "$snapshot")" || { echo 'Release changed during verification. Promotion blocked.' >&2; exit 1; }
          # Changes the release visibility only; binaries, tag and signatures stay untouched.
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false
          echo "Promoted $VERSION with no rebuild or asset replacement."
