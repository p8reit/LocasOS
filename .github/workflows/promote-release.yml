name: Promote LOCAS Beta to Stable
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tested release tag (for example v0.10.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  promote:
    if: github.repository == 'p8reit/LocasOS'
    runs-on: ubuntu-24.04
    environment: locasos-stable-promotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Verify exact signed archive and promote only release visibility
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          LOCAS_UPDATE_PUBLIC_KEY_B64: ${{ vars.LOCAS_RELEASE_ED25519_PUBLIC_KEY_B64 }}
        run: |
          set -Eeuo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version tag' >&2; exit 1; }
          test -n "$LOCAS_UPDATE_PUBLIC_KEY_B64" || { echo 'Pinned publisher public key not configured' >&2; exit 1; }
          current="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"
          echo "$current" | jq -e '.draft == false and .prerelease == true' >/dev/null
          for required in locasos-upgrade-amd64.tar locasos-update.json locasos-update.sig Upgrade-LocasOS.ps1 upgrade-locas.sh; do
            echo "$current" | jq -e --arg n "$required" '[.assets[].name] | map(select(. == $n)) | length == 1' >/dev/null
          done
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$work" \
            --pattern 'locasos-upgrade-amd64.tar' \
            --pattern 'locasos-update.json' \
            --pattern 'locasos-update.sig'
          go run ./cmd/locas-release verify "$VERSION" "$work"
          # This edits the existing release only; no rebuild or asset upload occurs.
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease=false
          echo "Promoted signed tested $VERSION without re-signing or replacing the archive."
